appId: com.aerolince.laudo
productName: Aerolince
# O app é em português: só esses idiomas do Electron (menos peso e menos arquivos para assinar).
electronLanguages: [pt-BR, pt, en]
directories:
  output: release
files:
  - out/**
  - package.json
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  - build/icon.png
extraResources:
  - perfis/**
  - masks-exemplo/**
  - biblioteca-base/**
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.medical
  # Developer ID + hardened runtime. A notarização usa o perfil do notarytool
  # no Keychain: APPLE_KEYCHAIN_PROFILE=notary npm run dist:mac
  identity: 'SALOMAO Filho (RW5PXM3VUN)'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: 'O Aerolince usa o microfone para o ditado dos laudos.'
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  # pt-BR
  language: '1046'
npmRebuild: false
