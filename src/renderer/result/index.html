<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Aerolince — Laudo (rascunho)</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body { background: var(--bg); color: var(--texto); }
      .app { display: flex; flex-direction: column; height: 100%; }
      .cabecalho {
        padding: 10px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--linha);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        -webkit-app-region: drag;
      }
      .cabecalho button, .cabecalho input { -webkit-app-region: no-drag; }
      .logo { height: 15px; display: block; }
      @media (prefers-color-scheme: dark) { .logo { filter: invert(1) brightness(1.6); } }
      .separador { width: 1px; height: 18px; background: var(--linha); }
      .exame { font-weight: 700; font-size: 13.5px; letter-spacing: 0.01em; }
      .chip {
        font-size: 11px;
        font-weight: 600;
        background: var(--oxido-suave);
        border: 1px solid color-mix(in srgb, var(--oxido) 45%, transparent);
        color: var(--texto);
        border-radius: 999px;
        padding: 2px 9px;
      }
      .chip.conf { background: color-mix(in srgb, var(--texto) 6%, transparent); border-color: var(--linha); }
      .menu-btn {
        margin-left: auto;
        font-size: 16px;
        line-height: 1;
        padding: 4px 9px;
        border-radius: 8px;
        border: 1px solid var(--linha);
        background: var(--surface-2);
        color: var(--texto);
        cursor: pointer;
      }
      .menu-btn:hover { border-color: var(--oxido); }
      textarea {
        flex: 1;
        margin: 14px 16px 8px;
        padding: 14px;
        font: 13px/1.55 'SF Mono', Menlo, Consolas, monospace;
        border: 1px solid var(--linha);
        border-radius: 10px;
        resize: none;
        background: var(--surface-2);
        color: var(--texto);
      }
      textarea:focus { outline: 2px solid var(--oxido-suave); }
      .acoes { display: flex; gap: 8px; align-items: center; padding: 0 16px 8px; }
      button {
        padding: 8px 16px;
        border-radius: 9px;
        border: 1px solid var(--linha);
        background: var(--surface);
        color: var(--texto);
        cursor: pointer;
        font-family: var(--fonte);
        font-size: 13px;
        font-weight: 600;
      }
      button:hover { border-color: color-mix(in srgb, var(--texto) 35%, transparent); }
      button:focus-visible { outline: 2px solid var(--oxido); outline-offset: 1px; }
      button.primario { background: var(--oxido); color: #fff; border-color: var(--oxido); }
      button.primario:hover { background: var(--oxido-escuro); border-color: var(--oxido-escuro); }
      button.gravando { background: var(--oxido); color: #fff; border-color: var(--oxido); animation: pulsa 1.1s infinite; }
      @keyframes pulsa {
        0%, 100% { box-shadow: 0 0 0 0 rgba(217, 91, 63, 0.45); }
        50% { box-shadow: 0 0 0 8px rgba(217, 91, 63, 0); }
      }
      @media (prefers-reduced-motion: reduce) { button.gravando { animation: none; } }
      button:disabled { opacity: 0.5; cursor: default; }
      .refino { padding-bottom: 10px; }
      .refino input {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid var(--linha);
        border-radius: 9px;
        font-family: var(--fonte);
        font-size: 13px;
        background: var(--surface-2);
        color: var(--texto);
      }
      .refino input:focus { outline: 2px solid var(--oxido-suave); }
      .status { font-size: 12px; color: var(--texto-suave); }
      .rodape {
        padding: 8px 16px;
        font-size: 11px;
        color: var(--texto-suave);
        border-top: 1px solid var(--linha);
        background: var(--surface);
      }
      .aviso { color: var(--oxido); font-weight: 800; letter-spacing: 0.02em; }
      .erro-box {
        margin: 14px 16px;
        padding: 12px 14px;
        background: var(--oxido-suave);
        border: 1px solid color-mix(in srgb, var(--oxido) 50%, transparent);
        border-radius: 10px;
        color: var(--texto);
        font-size: 13px;
      }
      .vazio {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--texto-suave);
        font-size: 14px;
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
