<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Aerolince</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      #root {
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: drag;
        font-family: var(--fonte);
      }
      .botao {
        -webkit-app-region: no-drag;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 1.5px solid var(--linha);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px rgba(24, 23, 22, 0.28);
        transition: transform 0.1s ease, background 0.15s ease;
        background: var(--branco);
        color: var(--oxido);
      }
      .botao:active {
        transform: scale(0.94);
      }
      .botao:focus-visible {
        outline: 2px solid var(--oxido);
        outline-offset: 2px;
      }
      .gravando {
        background: var(--oxido);
        border-color: var(--oxido);
        color: var(--branco);
        animation: pulsa 1.1s infinite;
      }
      .processando {
        background: var(--preto);
        border-color: var(--preto);
        color: var(--branco);
      }
      .processando svg {
        animation: respira 1.2s ease-in-out infinite;
      }
      .ok {
        background: var(--preto);
        border-color: var(--preto);
        color: var(--branco);
        font-size: 26px;
      }
      .erro {
        background: var(--branco);
        border: 2px solid var(--oxido);
        color: var(--oxido);
        font-size: 26px;
        font-weight: 700;
      }
      .parar {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        background: var(--branco);
      }
      @keyframes pulsa {
        0%, 100% { box-shadow: 0 0 0 0 rgba(217, 91, 63, 0.55); }
        50% { box-shadow: 0 0 0 14px rgba(217, 91, 63, 0); }
      }
      @keyframes respira {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @media (prefers-reduced-motion: reduce) {
        .gravando, .processando svg { animation: none; }
      }
      .tempo {
        position: absolute;
        bottom: 3px;
        width: 100%;
        text-align: center;
        font-size: 10px;
        font-weight: 700;
        color: var(--branco);
        text-shadow: 0 1px 3px rgba(24, 23, 22, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
